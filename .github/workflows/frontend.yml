name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [main]
  # Rebuild from the Actions tab, e.g. after setting VITE_API_URL or CUSTOM_DOMAIN.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Repo variables (Settings > Secrets and variables > Actions > Variables):
      #   VITE_API_URL  – Render backend URL, e.g. https://bdm-luxe-backend.onrender.com
      #   CUSTOM_DOMAIN – e.g. example.com (optional; canonical URLs, sitemap, CNAME)
      VITE_API_URL: ${{ vars.VITE_API_URL }}
      SITE_URL: ${{ vars.CUSTOM_DOMAIN && format('https://{0}', vars.CUSTOM_DOMAIN) || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Check VITE_API_URL is set
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "::warning::VITE_API_URL is not set, so the quote and contact forms will ask visitors to call or email. Set the repo variable to the Render backend URL and re-run this workflow."
          fi
      - uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run lint
      # One build serves both https://<owner>.github.io/BDM_Luxe/ and a custom
      # domain root: asset URLs and the router base are resolved at runtime.
      - run: npm run build
      - name: Add CNAME for custom domain
        if: ${{ vars.CUSTOM_DOMAIN != '' }}
        run: echo "${{ vars.CUSTOM_DOMAIN }}" > dist/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <title>BDM Luxe</title>
    <script>
      // GitHub Pages SPA fallback (after rafgraph/spa-github-pages).
      // Deep links like /BDM_Luxe/services/hardscape (github.io) or
      // /services/hardscape (custom domain) are redirected to the base
      // index.html with the path in the query string; index.html restores it.
      var REPO = 'bdm_luxe';
      var l = window.location;
      var first = (l.pathname.split('/')[1] || '').toLowerCase();
      var keep = first === REPO ? 1 : 0;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + keep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(keep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body style="background:#121410;color:#EFE8DA;font-family:system-ui,sans-serif"></body>
</html>
